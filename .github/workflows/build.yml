name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk AsparMapper.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: AsparMapper-apk
          path: AsparMapper.apk

      - name: Publish to the "latest" release (easy download on the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest AsparMapper.apk \
            --title "آخرین نسخه (build ${{ github.run_number }})" \
            --notes "ساخته شده از commit ${{ github.sha }}"
